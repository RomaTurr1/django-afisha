<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Афиша мероприятий{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card-event {
            border: none;
            border-radius: 12px;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .card-event:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        .badge-category {
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
            border-radius: 6px;
            padding: 0.35rem 0.65rem;
        }
        .badge-free {
            background-color: #dcfce7;
            color: #15803d;
            font-weight: 700;
            border-radius: 6px;
            padding: 0.35rem 0.65rem;
        }
        .badge-price {
            background-color: #fef3c7;
            color: #b45309;
            font-weight: 700;
            border-radius: 6px;
            padding: 0.35rem 0.65rem;
        }
        .badge-finished {
            background-color: #f1f5f9;
            color: #64748b;
            font-weight: 600;
            border-radius: 6px;
        }
        .btn-primary-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: #fff;
        }
        .filter-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        footer {
            margin-top: auto;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'events:event_list' %}">
                <i class="bi bi-calendar-event fs-4"></i>
                <span>Афиша Событий</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'events:event_list' %}">
                            <i class="bi bi-grid-fill me-1"></i> Все мероприятия
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-light text-primary fw-semibold px-3" href="{% url 'events:event_add' %}">
                            <i class="bi bi-plus-circle-fill me-1"></i> Добавить мероприятие
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50 ms-lg-2" href="/admin/" target="_blank">
                            <i class="bi bi-shield-lock me-1"></i> Админка
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="py-3 text-center text-muted small">
        <div class="container">
            <span>Афиша мероприятий &copy; Django практическая работа</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
